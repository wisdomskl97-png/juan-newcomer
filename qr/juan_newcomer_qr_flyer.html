<title>주안 웰컴 QR</title>
<style>
  @media (prefers-color-scheme: dark) {}

  :root {
    --paper: #FAF6EE;
    --paper-edge: #F1EAD9;
    --ink: #2B2620;
    --ink-soft: #6E6357;
    --ink-faint: #A79C8C;
    --yellow: #F2C230;
    --orange: #E07B2C;
    --pink: #E24B8A;
    --purple: #8E5AA8;
    --blue: #5C6BB0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #EDE7D8;
    color: var(--ink);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px 64px;
  }

  .sheet {
    width: 100%;
    max-width: 620px;
    aspect-ratio: 210 / 297;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    border-radius: 6px;
    box-shadow: 0 30px 80px -30px rgba(43, 38, 32, 0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6.5% 8% 5%;
    position: relative;
    overflow: hidden;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .brand img {
    height: 58px;
    width: auto;
  }

  .brand .en {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }

  .headline {
    margin-top: 7%;
    text-align: center;
  }

  .headline h1 {
    margin: 0;
    font-size: clamp(28px, 6.4vw, 40px);
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.28;
    text-wrap: balance;
  }

  .headline .accent {
    color: var(--orange);
  }

  .headline p {
    margin: 10px 0 0;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink-soft);
  }

  .qr-frame {
    margin-top: 8%;
    position: relative;
    width: 58%;
    max-width: 300px;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .qr-frame::before {
    content: "";
    position: absolute;
    inset: -9%;
    border-radius: 28px;
    background: conic-gradient(from 200deg,
      var(--yellow), var(--orange), var(--pink), var(--purple), var(--blue), var(--yellow));
    opacity: 0.9;
  }

  .qr-frame::after {
    content: "";
    position: absolute;
    inset: -2%;
    border-radius: 22px;
    background: var(--paper);
  }

  .qr-frame img {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    display: block;
  }

  .instruction {
    margin-top: 7%;
    text-align: center;
    max-width: 88%;
  }

  .instruction .kr {
    font-size: 16.5px;
    font-weight: 700;
    line-height: 1.55;
  }

  .instruction .en {
    margin-top: 5px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-soft);
  }

  .steps {
    margin-top: 6%;
    display: flex;
    gap: 22px;
  }

  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 84px;
  }

  .step .num {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    font-size: 12.5px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .step .label {
    font-size: 11.5px;
    font-weight: 600;
    text-align: center;
    color: var(--ink-soft);
    line-height: 1.4;
  }

  .spacer { flex: 1; min-height: 16px; }

  .footer {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding-top: 5%;
  }

  .footer .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .footer .dot:nth-child(1) { background: var(--yellow); }
  .footer .dot:nth-child(2) { background: var(--orange); }
  .footer .dot:nth-child(3) { background: var(--pink); }
  .footer .dot:nth-child(4) { background: var(--purple); }
  .footer .dot:nth-child(5) { background: var(--blue); }

  .footer .txt {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
  }

  .toolbar {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
  }

  .toolbar button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 20px;
    border: 1px solid var(--paper-edge);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }

  .toolbar button:hover { background: #fff; }

  @media print {
    html, body { background: #fff; }
    body { padding: 0; }
    .toolbar { display: none; }
    .sheet {
      box-shadow: none;
      border: none;
      border-radius: 0;
      width: 100%;
      max-width: none;
      aspect-ratio: auto;
      height: 100vh;
    }
    @page { size: A4; margin: 0; }
  }
</style>

  <button onclick="window.print()">인쇄하기 · Print</button>
</div>
